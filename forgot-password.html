<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cool Blog 忘記密碼頁面"
    />
    <title>Cool Blog - 忘記密碼</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      // 在頁面加載前應用主題，避免白色到黑色的閃爍
      const theme = localStorage.getItem('theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="forgot-password-page">
    <nav class="navbar login-navbar">
      <div class="container">
        <a class="nav-brand" href="index.html" style="text-decoration: none;">
          <span class="logo">🚀 Cool Blog</span>
        </a>
        <div class="login-nav-actions">
          <a class="btn btn-secondary" href="index.html">返回首頁</a>
          <button
            class="theme-toggle"
            id="themeToggle"
            aria-label="切換主題"
          >
            <span class="theme-icon">🌙</span>
          </button>
        </div>
      </div>
    </nav>

    <main class="login-main">
      <div class="container">
        <div class="login-grid">
          <section class="login-card">
            <div class="login-header">
              <p class="login-eyebrow">協助復原</p>
              <h1 class="login-title">忘記密碼</h1>
              <p class="login-subtitle">輸入你的 Email，我們會寄送重設連結給你。</p>
            </div>

            <form class="login-form" id="forgotPasswordForm" novalidate>
              <div class="form-field">
                <label for="email">Email</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  placeholder="name@example.com"
                  autocomplete="email"
                  required
                />
              </div>

              <button class="btn btn-primary btn-block" type="submit" id="resetSubmit">
                寄送重設連結
              </button>
              <div class="form-status" id="resetStatus" role="status" aria-live="polite"></div>
            </form>

            <div class="login-footer">
              <span>想起來了？</span>
              <a class="link" href="login.html">返回登入</a>
            </div>
          </section>

          <aside class="login-panel">
            <div class="login-panel-content">
              <span class="panel-badge">安全防護</span>
              <h2>保護你的帳號</h2>
              <p>
                我們會立即向你的 Email 寄送密碼重設連結。連結有效期限為 24 小時。
              </p>
              <ul class="panel-list">
                <li>🔒 加密傳輸</li>
                <li>📧 安全郵件驗證</li>
                <li>⏱️ 24 小時有效期</li>
              </ul>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <script src="js/forgot-password.js"></script>
  </body>
</html>
