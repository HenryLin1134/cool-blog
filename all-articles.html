<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="所有文章 - Cool Blog 部落格"
      data-i18n-content="allArticles.meta.description"
    />
    <title data-i18n-title="allArticles.meta.title">所有文章 - Cool Blog</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- 頁面載入動畫 -->
    <div id="preloader">
      <div class="loader"></div>
    </div>

    <!-- 導航欄 -->
    <nav class="navbar" id="navbar">
      <div class="container">
        <div class="nav-brand">
          <a href="index.html" class="logo">🚀 Cool Blog</a>
        </div>
        <button
          class="nav-toggle"
          id="navToggle"
          aria-label="Toggle navigation"
          data-i18n-aria-label="nav.toggleMenu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
        <ul class="nav-menu" id="navMenu">
          <li>
            <a href="index.html#home" class="nav-link" data-i18n="nav.home">首頁</a>
          </li>
          <li>
            <a href="index.html#about" class="nav-link" data-i18n="nav.about">關於我</a>
          </li>
          <li>
            <a href="all-articles.html" class="nav-link active" data-i18n="nav.blog">部落格</a>
          </li>
          <li>
            <a href="index.html#projects" class="nav-link" data-i18n="nav.projects">作品集</a>
          </li>
          <li>
            <a href="index.html#contact" class="nav-link" data-i18n="nav.contact">聯絡</a>
          </li>
          <li>
            <a href="login.html" class="nav-link" data-i18n="nav.login">登入</a>
          </li>
          <li class="lang-switcher">
            <label class="sr-only" for="langSelect" data-i18n="nav.language">語言</label>
            <select
              id="langSelect"
              class="lang-select"
              aria-label="語言"
              data-i18n-aria-label="nav.language"
            >
              <option value="zh-TW">繁體中文</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
            </select>
          </li>
          <li>
            <button
              class="theme-toggle"
              id="themeToggle"
              aria-label="Toggle theme"
              data-i18n-aria-label="nav.toggleTheme"
            >
              <span class="theme-icon">🌙</span>
            </button>
          </li>
        </ul>
      </div>
    </nav>

    <!-- 主內容區 -->
    <main class="all-articles-page">
      <section class="page-header">
        <div class="container">
          <h1 class="page-title" data-i18n="allArticles.pageTitle">所有文章</h1>
          <p class="page-subtitle" data-i18n="allArticles.pageSubtitle">
            探索我的所有創作與分享
          </p>
        </div>
      </section>

      <section class="articles-section">
        <div class="container">
          <!-- 篩選與排序 -->
          <div class="articles-controls">
            <div class="filter-group">
              <label for="categoryFilter" data-i18n="allArticles.filterByCategory">分類：</label>
              <select id="categoryFilter" class="filter-select">
                <option value="all" data-i18n="allArticles.allCategories">全部</option>
                <option value="技術" data-i18n="allArticles.category.tech">技術</option>
                <option value="教學" data-i18n="allArticles.category.tutorial">教學</option>
                <option value="生活" data-i18n="allArticles.category.life">生活</option>
              </select>
            </div>
            <div class="sort-group">
              <label for="sortSelect" data-i18n="allArticles.sortBy">排序：</label>
              <select id="sortSelect" class="sort-select">
                <option value="newest" data-i18n="allArticles.sort.newest">最新</option>
                <option value="oldest" data-i18n="allArticles.sort.oldest">最舊</option>
                <option value="title" data-i18n="allArticles.sort.title">標題</option>
              </select>
            </div>
          </div>

          <!-- 文章網格 -->
          <div class="articles-grid" id="articlesGrid">
            <!-- 文章卡片將由 JavaScript 動態生成 -->
          </div>

          <!-- 無文章提示 -->
          <div class="no-articles" id="noArticles" style="display: none;">
            <p data-i18n="allArticles.noArticles">沒有找到符合條件的文章</p>
          </div>
        </div>
      </section>
    </main>

    <!-- 頁尾 -->
    <footer class="footer">
      <div class="container">
        <div class="footer-content">
          <div class="footer-section">
            <h3>🚀 Cool Blog</h3>
            <p data-i18n="footer.brand">用心製作，用愛分享</p>
          </div>
          <div class="footer-section">
            <h4 data-i18n="footer.quickLinks">快速連結</h4>
            <ul>
              <li><a href="index.html#home" data-i18n="nav.home">首頁</a></li>
              <li><a href="index.html#about" data-i18n="nav.about">關於我</a></li>
              <li><a href="all-articles.html" data-i18n="nav.blog">部落格</a></li>
              <li><a href="index.html#projects" data-i18n="nav.projects">作品集</a></li>
              <li><a href="index.html#contact" data-i18n="nav.contact">聯絡</a></li>
            </ul>
          </div>
          <div class="footer-section">
            <h4 data-i18n="footer.social">社群媒體</h4>
            <div class="social-links">
              <a href="#" aria-label="GitHub"><span>💻</span></a>
              <a href="#" aria-label="Twitter"><span>🐦</span></a>
              <a href="#" aria-label="LinkedIn"><span>💼</span></a>
            </div>
          </div>
        </div>
        <div class="footer-bottom">
          <p data-i18n="footer.copyright">© 2026 Cool Blog. Built with ❤️ and ☕</p>
          <button class="back-to-top" id="backToTop" aria-label="回到頂部">
            ↑
          </button>
        </div>
      </div>
    </footer>

    <!-- Modal (文章詳細) -->
    <div class="modal" id="articleModal" style="display: none;">
      <div class="modal-content">
        <button class="modal-close" id="modalClose" aria-label="關閉">×</button>
        <div class="modal-body" id="modalBody">
          <!-- 動態載入文章內容 -->
        </div>
      </div>
    </div>

    <script src="js/all-articles.js"></script>
  </body>
</html>
