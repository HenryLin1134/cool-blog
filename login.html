<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cool Blog 登入頁面"
    />
    <title>Cool Blog - 登入</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      // 在頁面加載前應用主題，避免白色到黑色的閃爍
      const theme = localStorage.getItem('theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="login-page">
    <nav class="navbar login-navbar">
      <div class="container">
        <a class="nav-brand" href="index.html" style="text-decoration: none;">
          <span class="logo">🚀 Cool Blog</span>
        </a>
        <div class="login-nav-actions">
          <a class="btn btn-secondary" href="index.html#contact">聯絡我</a>
          <button
            class="theme-toggle"
            id="themeToggle"
            aria-label="切換主題"
          >
            <span class="theme-icon">🌙</span>
          </button>
        </div>
      </div>
    </nav>

    <main class="login-main">
      <div class="container">
        <div class="login-grid">
          <section class="login-card">
            <div class="login-header">
              <p class="login-eyebrow">歡迎回來</p>
              <h1 class="login-title">登入你的帳號</h1>
              <p class="login-subtitle">使用你的 Email 繼續管理與探索內容。</p>
            </div>

            <form class="login-form" id="loginForm" novalidate>
              <div class="form-field">
                <label for="email">Email</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  placeholder="name@example.com"
                  autocomplete="email"
                  required
                />
              </div>

              <div class="form-field">
                <label for="password">密碼</label>
                <div class="input-wrapper">
                  <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="輸入密碼"
                    autocomplete="current-password"
                    required
                  />
                  <button
                    class="password-toggle"
                    type="button"
                    id="passwordToggle"
                    aria-label="顯示或隱藏密碼"
                  >
                    顯示
                  </button>
                </div>
              </div>

              <div class="form-meta">
                <label class="checkbox">
                  <input type="checkbox" id="rememberMe" />
                  <span>記住我</span>
                </label>
                <a class="link" href="forgot-password.html">忘記密碼？</a>
              </div>

              <button class="btn btn-primary btn-block" type="submit" id="loginSubmit">
                登入
              </button>
              <div class="form-status" id="loginStatus" role="status" aria-live="polite"></div>
            </form>

            <div class="login-footer">
              <span>還沒有帳號？</span>
              <a class="link" href="index.html#contact">聯絡我建立</a>
            </div>
          </section>

          <aside class="login-panel">
            <div class="login-panel-content">
              <span class="panel-badge">專注創作</span>
              <h2>管理你的文章與作品</h2>
              <p>
                登入後可快速更新文章、追蹤最新專案進度，並與讀者保持互動。
              </p>
              <ul class="panel-list">
                <li>✨ 即時編輯文章與標籤</li>
                <li>📈 追蹤閱讀趨勢</li>
                <li>🔒 安全的內容管理</li>
              </ul>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <script src="js/login.js"></script>
  </body>
</html>
